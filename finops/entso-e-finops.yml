meters:
- name: api_requests
  description: >-
    Requests against the single /api endpoint. Never billed, but capped at
    400/minute per IP/token - the budget to allocate across internal
    consumers sharing a token.
  unit: requests
  aggregation: sum
  dimensions:
  - token
  - ip-address
  - documentType
- name: ingest_compute
  description: Consumer-side compute for polling, XML parsing, and ZIP extraction (your infrastructure, not ENTSO-E's).
  unit: hours
  aggregation: sum
  dimensions:
  - pipeline
- name: storage
  description: Consumer-side storage of retained market documents and derived time series.
  unit: bytes
  aggregation: sum
  dimensions:
  - dataset
  - bidding-zone
principles:
- name: Visibility
  description: >-
    Track request counts per documentType and bidding zone against the
    400/minute cap; alert on 429 bans and on Acknowledgement 999 responses
    that indicate wasted polling of unpublished data.
- name: Allocation
  description: >-
    If multiple internal teams share one security token, meter and allocate
    the request budget per pipeline; consider separate registrations per
    team to isolate rate budgets.
- name: Optimization
  description: >-
    Cache aggressively - published market documents are immutable; backfill
    in maximal one-year windows; schedule day-ahead price pulls once after
    the daily publication instead of polling; use the File Library for bulk
    history.
- name: Accountability
  description: >-
    Assign an owner per ingest pipeline; review polling schedules against
    actual publication cadences so free data does not turn into avoidable
    infrastructure spend.
