description: >-
  FinOps view of consuming the ENTSO-E Transparency Platform API. There is no
  vendor invoice at any usage level - the platform is a regulatory
  publication under EU Regulation 543/2013 and the API is free after
  registration. All cost of ownership therefore sits on the consumer side:
  the compute and storage to poll the API within its 400 requests/minute cap,
  parse IEC 62325 XML (and unzip the imbalance/outage archives), and retain
  history pulled in one-year-per-request windows. Teams building price-aware
  products (dynamic kWh tariffs, battery dispatch, balancing analytics)
  typically ingest each bidding zone daily after day-ahead publication and
  backfill history once, which keeps request volumes trivially small.
notes: >-
  Because rate and range limits - not billing - are the scarce resource,
  optimize for fewer, larger queries (full one-year ranges on backfills) and
  cache responses; re-polling published history yields identical documents.
  The File Library covers bulk needs without consuming API rate budget.
