name: ENTSO-E
kind: organization
description: ENTSO-E, the European Network of Transmission System Operators for Electricity, operates
  the Transparency Platform - the central publication point for pan-European electricity market data under
  EU Regulation 543/2013. Its free RESTful API returns day-ahead prices, system load, generation, balancing,
  and cross-border transmission data for every European bidding zone and control area as IEC 62325 XML
  market documents, selected by coded documentType and processType parameters against a single endpoint.
