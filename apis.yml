aid: entso-e
url: https://raw.githubusercontent.com/api-evangelist/entso-e/refs/heads/main/apis.yml
name: ENTSO-E
kind: organization
description: >-
  ENTSO-E, the European Network of Transmission System Operators for
  Electricity, operates the Transparency Platform - the central publication
  point for pan-European electricity market data under EU Regulation 543/2013.
  Its free RESTful API returns day-ahead prices, system load, generation,
  balancing, and cross-border transmission data for every European bidding
  zone and control area as IEC 62325 XML market documents, selected by coded
  documentType and processType parameters against a single endpoint.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Electricity
- Energy
- Energy Markets
- Day-Ahead Prices
- Balancing
- Transmission
- Grid Data
- Europe
created: '2026-07-11'
modified: '2026-07-11'
specificationVersion: '0.19'
apis:
- aid: entso-e:entso-e-day-ahead-prices-api
  name: ENTSO-E Day-Ahead Prices API
  tags:
  - Day-Ahead Prices
  - Electricity Prices
  - Spot Prices
  - Energy Markets
  - kWh Rates
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://documenter.getpostman.com/view/7009892/2s93JtP3F6
  baseURL: https://web-api.tp.entsoe.eu/api
  properties:
  - url: https://transparencyplatform.zendesk.com/hc/en-us
    type: Documentation
  - url: https://documenter.getpostman.com/view/7009892/2s93JtP3F6
    type: APIReference
  - url: openapi/entso-e-openapi.yml
    type: OpenAPI
  - url: collections/entso-e.postman_collection.json
    type: PostmanCollection
  - url: collections/entso-e.opencollection.json
    type: OpenCollection
  description: >-
    Wholesale day-ahead electricity prices (Transparency Regulation article
    12.1.D) for every European bidding zone, per market time unit in currency
    per MWh - the reference price behind consumer kWh rates and dynamic
    tariffs. Query with documentType=A44 and the bidding zone EIC code in both
    in_Domain and out_Domain; up to one year per request, returned as a
    Publication_MarketDocument.
- aid: entso-e:entso-e-load-api
  name: ENTSO-E Load API
  tags:
  - Electricity Load
  - Demand
  - Forecasts
  - Consumption
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://documenter.getpostman.com/view/7009892/2s93JtP3F6
  baseURL: https://web-api.tp.entsoe.eu/api
  properties:
  - url: https://transparencyplatform.zendesk.com/hc/en-us
    type: Documentation
  - url: https://documenter.getpostman.com/view/7009892/2s93JtP3F6
    type: APIReference
  - url: openapi/entso-e-openapi.yml
    type: OpenAPI
  - url: collections/entso-e.postman_collection.json
    type: PostmanCollection
  - url: collections/entso-e.opencollection.json
    type: OpenCollection
  description: >-
    Actual system total load and day-ahead, week-ahead, month-ahead, and
    year-ahead load forecasts per bidding zone (articles 6.1.A-6.1.E). Query
    with documentType=A65, processType A16 (realised) or A01/A31/A32/A33
    (forecasts), and outBiddingZone_Domain; returned as a GL_MarketDocument
    per market time unit.
- aid: entso-e:entso-e-generation-api
  name: ENTSO-E Generation API
  tags:
  - Electricity Generation
  - Renewables
  - Wind
  - Solar
  - Installed Capacity
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://documenter.getpostman.com/view/7009892/2s93JtP3F6
  baseURL: https://web-api.tp.entsoe.eu/api
  properties:
  - url: https://transparencyplatform.zendesk.com/hc/en-us
    type: Documentation
  - url: https://documenter.getpostman.com/view/7009892/2s93JtP3F6
    type: APIReference
  - url: openapi/entso-e-openapi.yml
    type: OpenAPI
  - url: collections/entso-e.postman_collection.json
    type: PostmanCollection
  - url: collections/entso-e.opencollection.json
    type: OpenCollection
  description: >-
    Actual generation per production type (documentType=A75, processType=A16)
    and per generation unit (A73), day-ahead generation forecasts (A71), wind
    and solar forecasts (A69), installed capacity per type (A68) and per unit,
    and water reservoir filling levels (A72) - filterable by psrType across
    production types from nuclear (B14) to solar (B16) and onshore wind (B19).
- aid: entso-e:entso-e-balancing-api
  name: ENTSO-E Balancing API
  tags:
  - Balancing
  - Balancing Data
  - Imbalance Prices
  - Reserves
  - Grid Frequency
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://documenter.getpostman.com/view/7009892/2s93JtP3F6
  baseURL: https://web-api.tp.entsoe.eu/api
  properties:
  - url: https://transparencyplatform.zendesk.com/hc/en-us
    type: Documentation
  - url: https://documenter.getpostman.com/view/7009892/2s93JtP3F6
    type: APIReference
  - url: openapi/entso-e-openapi.yml
    type: OpenAPI
  - url: collections/entso-e.postman_collection.json
    type: PostmanCollection
  - url: collections/entso-e.opencollection.json
    type: OpenCollection
  description: >-
    Balancing market data per control area (articles 17.1.B-17.1.J) -
    contracted balancing reserves and their prices (documentType A81/A89),
    accepted aggregated offers (A82), activated balancing energy and prices
    (A83/A84), imbalance prices (A85) and total imbalance volumes (A86, both
    delivered as ZIP of XML), cross-border balancing (A88), and procured
    balancing capacity (A15) - filterable by reserve type (FCR, aFRR, mFRR,
    RR) via businessType and processType.
- aid: entso-e:entso-e-transmission-api
  name: ENTSO-E Transmission API
  tags:
  - Transmission
  - Cross-Border Flows
  - Transfer Capacity
  - Interconnectors
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://documenter.getpostman.com/view/7009892/2s93JtP3F6
  baseURL: https://web-api.tp.entsoe.eu/api
  properties:
  - url: https://transparencyplatform.zendesk.com/hc/en-us
    type: Documentation
  - url: https://documenter.getpostman.com/view/7009892/2s93JtP3F6
    type: APIReference
  - url: openapi/entso-e-openapi.yml
    type: OpenAPI
  - url: collections/entso-e.postman_collection.json
    type: PostmanCollection
  - url: collections/entso-e.opencollection.json
    type: OpenCollection
  description: >-
    Cross-border physical flows between areas (documentType=A11, one direction
    per request), forecasted transfer capacities at daily through yearly
    horizons (A61 with contract_MarketAgreement.Type A01-A04), day-ahead
    commercial schedules (A09), offered and allocated capacity, and net
    positions - keyed by in_Domain/out_Domain EIC border pairs.
